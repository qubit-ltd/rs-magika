name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@main

  prepare-feature-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate and generate feature matrix
        id: matrix
        run: |
          set -euo pipefail
          config=.infra/ci/cargo-matrix.json
          jq -e '
            .version == 1
            and (.checks | type == "array" and length > 0)
            and all(.checks[];
              (.name | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$"))
              and (.commands | type == "array" and length > 0)
              and ((if has("defaultFeatures") then .defaultFeatures else true end) | type == "boolean")
              and ((.features // []) | type == "array" and all(.[]; type == "string"))
            )
          ' "$config" > /dev/null
          matrix=$(jq -c '{include: [.checks[] | {
            name,
            commands: (.commands | join(",")),
            default_features: (if has("defaultFeatures") then .defaultFeatures else true end),
            features: ((.features // []) | join(","))
          }]}' "$config")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  dynamic-loader:
    name: Dynamic ONNX Runtime consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Download and verify ONNX Runtime 1.24.2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/onnxruntime-linux-x64-1.24.2.tgz"
          curl --fail --location --silent --show-error \
            https://github.com/microsoft/onnxruntime/releases/download/v1.24.2/onnxruntime-linux-x64-1.24.2.tgz \
            --output "$archive"
          echo '43725474ba5663642e17684717946693850e2005efbd724ac72da278fead25e6  '"$archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/onnxruntime"
          tar -xzf "$archive" -C "$RUNNER_TEMP/onnxruntime"
          echo "ORT_LIBRARY_PATH=$RUNNER_TEMP/onnxruntime/onnxruntime-linux-x64-1.24.2/lib/libonnxruntime.so" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/onnxruntime/onnxruntime-linux-x64-1.24.2/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Check dynamic feature selection
        run: |
          python3 .infra/check-dynamic-loader-features.py --self-test
          cargo +1.94.0 tree --locked --manifest-path tests/fixtures/dynamic_loader/Cargo.toml -e features | python3 .infra/check-dynamic-loader-features.py
      - name: Compile README consumer
        run: cargo +1.94.0 check --locked --manifest-path tests/fixtures/readme_consumer/Cargo.toml
      - name: Run isolated dynamic loading consumer
        run: cargo +1.94.0 run --locked --manifest-path tests/fixtures/dynamic_loader/Cargo.toml
