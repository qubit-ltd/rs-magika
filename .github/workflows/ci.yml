name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@main

  platform-smoke:
    name: Native platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-latest
    defaults:
      run:
        working-directory: sources/rs-magika
        shell: bash
    steps:
      - name: Checkout rs-magika under sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: sources/rs-magika
      - name: Prepare pinned local path dependencies
        run: .infra/lib/prepare-local-path-dependencies.sh
      - name: Verify pinned local path dependencies
        run: .infra/lib/check-locked-local-path-dependencies.sh
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Detect real files with Magika
        run: cargo +1.94.0 test --locked --test tests test_magika_detector_detect_file_
      - name: Refine only regular local files
        run: cargo +1.94.0 test --locked --test tests test_local_file_refinement_applies_only_to_regular_files
      - name: Check Unix special paths
        if: runner.os == 'macOS'
        run: "cargo +1.94.0 test --locked --test tests local_file_type_tests::"

  dynamic-loader:
    name: Dynamic ONNX Runtime consumer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sources/rs-magika
    steps:
      - name: Checkout rs-magika under sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: sources/rs-magika
      - name: Prepare pinned local path dependencies
        run: .infra/lib/prepare-local-path-dependencies.sh
      - name: Verify pinned local path dependencies
        run: .infra/lib/check-locked-local-path-dependencies.sh
      - name: Record candidate source commits
        run: |
          set -euo pipefail
          for repo in . ../rs-mime ../rs-operation; do
            printf '%s ' "$repo"
            git -C "$repo" rev-parse HEAD
          done
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Generate bundled documentation consumer locks
        id: consumer-locks
        run: |
          set +e
          python3 -B .infra/check-readme-examples.py --run-example > "$RUNNER_TEMP/readme-consumer-check.log" 2>&1
          readme_status=$?
          python3 -B .infra/check-managed-guide-examples.py > "$RUNNER_TEMP/managed-guide-consumer-check.log" 2>&1
          guide_status=$?
          python3 -B .infra/record-consumer-ci-evidence.py \
            --readme-exit "$readme_status" \
            --guide-exit "$guide_status"
          evidence_status=$?
          cat "$RUNNER_TEMP/readme-consumer-check.log"
          cat "$RUNNER_TEMP/managed-guide-consumer-check.log"
          if [ "$readme_status" -ne 0 ]; then exit "$readme_status"; fi
          if [ "$guide_status" -ne 0 ]; then exit "$guide_status"; fi
          exit "$evidence_status"
      - name: Upload bundled documentation consumer evidence
        if: always() && steps.consumer-locks.outputs.evidence_present == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: magika-consumer-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.consumer-locks.outputs.artifact_paths }}
          if-no-files-found: error
          retention-days: 14
      - name: Download and verify ONNX Runtime 1.24.2 wheel
        run: |
          set -euo pipefail
          wheel="$RUNNER_TEMP/onnxruntime-1.24.2-cp311-cp311-manylinux_x86_64.whl"
          curl --fail --location --silent --show-error \
            https://files.pythonhosted.org/packages/2c/32/4e5921ba8b82ac37cad45f1108ca6effd430f49c7f20577d53f317d166ed/onnxruntime-1.24.2-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl \
            --output "$wheel"
          echo '93fe190ee555ae8e9c1214bcfcf13af85cd06dd835e8d835ce5a8d01056844fe  '"$wheel" | sha256sum --check
          mkdir "$RUNNER_TEMP/onnxruntime"
          unzip -q "$wheel" -d "$RUNNER_TEMP/onnxruntime"
          echo "ORT_LIBRARY_PATH=$RUNNER_TEMP/onnxruntime/onnxruntime/capi/libonnxruntime.so.1.24.2" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/onnxruntime/onnxruntime/capi:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Check dynamic feature selection
        run: |
          set -euo pipefail
          host="$(rustc +1.94.0 -vV | sed -n 's/^host: //p')"
          test -n "$host"
          python3 .infra/check-dynamic-loader-features.py --self-test
          cargo +1.94.0 metadata --locked --format-version 1 --filter-platform "$host" --manifest-path tests/fixtures/dynamic_loader/Cargo.toml | python3 .infra/check-dynamic-loader-features.py --expect-inventory disabled
          cargo +1.94.0 check --locked --manifest-path tests/fixtures/dynamic_loader/Cargo.toml --bin magika-dynamic-loader-fixture
          candidate_sources=(
            --expect-source "qubit-magika=$PWD/Cargo.toml"
            --expect-source "qubit-mime=$PWD/../rs-mime/Cargo.toml"
            --expect-source "qubit-operation=$PWD/../rs-operation/Cargo.toml"
          )
          cargo +1.94.0 metadata --locked --format-version 1 --filter-platform "$host" --manifest-path tests/fixtures/readme_consumer/Cargo.toml | python3 .infra/check-dynamic-loader-features.py --expect-inventory disabled "${candidate_sources[@]}"
          cargo +1.94.0 metadata --locked --format-version 1 --filter-platform "$host" --manifest-path tests/fixtures/readme_consumer/Cargo.toml --features inventory | python3 .infra/check-dynamic-loader-features.py --expect-inventory enabled "${candidate_sources[@]}"
          negative_metadata="$RUNNER_TEMP/dynamic-loader-other-platform-metadata.json"
          negative_errors="$RUNNER_TEMP/dynamic-loader-other-platform-errors.txt"
          cargo +1.94.0 metadata --locked --format-version 1 --filter-platform "$host" --manifest-path tests/fixtures/dynamic_loader_other_platform/Cargo.toml > "$negative_metadata"
          if python3 .infra/check-dynamic-loader-features.py --expect-inventory disabled < "$negative_metadata" 2> "$negative_errors"; then
            echo "dynamic dependency checker accepted a dependency limited to another platform" >&2
            exit 1
          fi
          grep -F "expected one reachable qubit-magika package identity" "$negative_errors"
      - name: Compile README consumer
        run: cargo +1.94.0 check --locked --manifest-path tests/fixtures/readme_consumer/Cargo.toml
      - name: Compile Magika inventory consumer
        run: cargo +1.94.0 check --locked --manifest-path tests/fixtures/readme_consumer/Cargo.toml --bin magika-inventory-consumer
      - name: Run README consumer with isolated dynamic loading
        run: cargo +1.94.0 run --locked --manifest-path tests/fixtures/readme_consumer/Cargo.toml
      - name: Run README consumer with inventory and isolated dynamic loading
        run: cargo +1.94.0 run --locked --manifest-path tests/fixtures/readme_consumer/Cargo.toml --features inventory
      - name: Run explicitly registered Magika consumer
        run: cargo +1.94.0 run --locked --manifest-path tests/fixtures/readme_consumer/Cargo.toml --bin magika-inventory-consumer
      - name: Run auto-discovered Magika consumer
        run: cargo +1.94.0 run --locked --manifest-path tests/fixtures/readme_consumer/Cargo.toml --bin magika-inventory-consumer --features inventory
