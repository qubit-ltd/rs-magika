[package]
name = "qubit-magika"
version = "0.4.1"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-magika"
description = "Magika-backed MIME detector integration for qubit-mime"
homepage = "https://github.com/qubit-ltd/rs-magika"
documentation = "https://docs.rs/qubit-magika"
readme = "README.md"
keywords = ["mime", "magika", "detection", "file", "qubit"]
categories = ["filesystem", "parser-implementations"]
exclude = [
    "align-ci.sh",
    "ci-check.sh",
    "coverage.sh",
    "style-check.sh",
    "update-submodule.sh",
    ".github/*",
    ".llvm-cov.toml",
    ".cargo-audit.toml.example",
]

[lib]
name = "qubit_magika"
doctest = true

[features]
default = ["bundled-onnxruntime"]
bundled-onnxruntime = ["ort/download-binaries", "ort/tls-native"]

[dependencies]
magika = "1.1"
thiserror = "2.0"

qubit-io = "0.1"
qubit-spi = "0.2"
qubit-mime = "0.5"

[dependencies.ort]
version = "=2.0.0-rc.12"
default-features = false
optional = true

[dev-dependencies]
qubit-config = "0.13"
tempfile = "3.27"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
