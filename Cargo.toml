[package]
name = "qubit-magika"
version = "0.14.0"
edition = "2024"
rust-version = "1.94"
autotests = false
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-magika"
description = "Magika-backed MIME detector integration for qubit-mime"
homepage = "https://github.com/qubit-ltd/rs-magika"
documentation = "https://docs.rs/qubit-magika"
readme = "README.md"
keywords = ["mime", "magika", "detection", "file", "qubit"]
categories = ["filesystem", "parser-implementations"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_magika"
doctest = true

[features]
default = ["bundled-onnxruntime"]
bundled-onnxruntime = ["ort/download-binaries", "ort/tls-rustls"]

[dependencies]
magika = "^1.1"
qubit-io = "0.17"
qubit-fs = { version = "0.2", default-features = false, features = ["async"] }
qubit-spi = { version = "0.12" }
qubit-mime = "0.17"

[dependencies.ort]
version = "=2.0.0-rc.12"
default-features = false
optional = true

[dev-dependencies]
qubit-config = "0.14"
qubit-fs-local = "0.9"
tempfile = "^3.27"

[[test]]
name = "tests"
path = "tests/mod.rs"

[[example]]
name = "basic"
path = "examples/basic.rs"
required-features = ["bundled-onnxruntime"]
