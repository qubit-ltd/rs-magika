[package]
name = "qubit-magika"
version = "0.7.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-magika"
description = "Magika-backed MIME detector integration for qubit-mime"
homepage = "https://github.com/qubit-ltd/rs-magika"
documentation = "https://docs.rs/qubit-magika"
readme = "README.md"
keywords = ["mime", "magika", "detection", "file", "qubit"]
categories = ["filesystem", "parser-implementations"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/RUST_CODING_STYLE.md",
    "/RUST_CODING_STYLE.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_magika"
doctest = true

[features]
default = ["bundled-onnxruntime"]
bundled-onnxruntime = ["ort/download-binaries", "ort/tls-rustls"]

[dependencies]
magika = "1.1"
thiserror = "2.0"

qubit-io = "0.5"
qubit-spi = "0.3"
qubit-mime = "0.7"

[dependencies.ort]
version = "=2.0.0-rc.12"
default-features = false
optional = true

[dev-dependencies]
qubit-config = "0.13"
tempfile = "3.27"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
