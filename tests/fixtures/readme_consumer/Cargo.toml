[package]
name = "magika-readme-consumer"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "magika-readme-consumer"

[workspace]

[features]
default = []
inventory = ["qubit-magika/inventory"]

[dependencies]
qubit-magika = { path = "../../..", default-features = false }
qubit-mime = { version = "^0.22", path = "../../../../rs-mime" }
qubit-operation = { version = "^0.3.2", path = "../../../../rs-operation" }
qubit-spi = "^0.14"
ort = { version = ">=2.0.0-rc.12,<2.1", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }

[patch.crates-io]
qubit-operation = { path = "../../../../rs-operation" }

[[bin]]
name = "magika-inventory-consumer"
path = "src/bin/magika_inventory_consumer.rs"
